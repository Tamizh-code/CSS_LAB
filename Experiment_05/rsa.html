<!DOCTYPE html><html><body><h2>RSA Algorithm</h2><input id=p value=53><input id=q value=59><input id=msg value=89><button onclick=RSA()>Run</button><pre id=o></pre><script>function g(a,b){return b?g(b,a%b):a} function RSA(){let p=+p.value,q=+q.value,m=+msg.value,n=p*q,t=(p-1)*(q-1),e=2;while(g(e,t)!=1)e++;let d=1;for(let i=0;i<10;i++){let x=1+i*t;if(x%e==0){d=x/e;break}}let ct=(m**e)%n; o.textContent=`Public:${n}\nExp:${e}\nPrivate:${d}\nCipher:${ct}`}</script></body></html>
